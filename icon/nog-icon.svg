<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="big" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块（微信头像展示为圆角方形） -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 星球：主体圆 -->
  <circle cx="256" cy="256" r="150" fill="url(#big)" opacity="0.95"/>

  <!-- 星球表面的高光 -->
  <ellipse cx="205" cy="200" rx="52" ry="34" fill="#ffffff" opacity="0.18" transform="rotate(-24 205 200)"/>

  <!-- 轨道环（斜向椭圆，穿过星球） -->
  <ellipse cx="256" cy="256" rx="196" ry="72" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.55" transform="rotate(-24 256 256)"/>

  <!-- 对勾 ✓（打卡完成，白色醒目） -->
  <path d="M150 268 L230 344 L372 178" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 星点装饰 -->
  <circle cx="392" cy="128" r="14" fill="#fde047" opacity="0.9"/>
  <circle cx="120" cy="392" r="10" fill="#fde047" opacity="0.7"/>

  <!-- 星球底部的两道光弧，呼应星环 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.25"/>
</svg>